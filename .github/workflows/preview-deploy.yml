name: Preview Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Forked pull requests cannot safely access deployment secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: Preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel preview environment
        run: npx vercel@39.1.3 pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Build first, then deploy the prebuilt artifact so broken code never reaches Vercel.
      - name: Build preview artifact
        run: npx vercel@39.1.3 build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview artifact
        id: deploy
        run: |
          url="$(npx vercel@39.1.3 deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Vercel preview deployed: ${url}`
            });
