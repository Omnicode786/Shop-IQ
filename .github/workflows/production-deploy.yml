name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Production deploys are serialized so an older run cannot overtake a newer deployment.
  group: production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    name: Deploy Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production environment
        run: npx vercel@39.1.3 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # The --prod build uses Vercel's production environment configuration.
      - name: Build production artifact
        run: npx vercel@39.1.3 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production artifact
        id: deploy
        run: |
          url="$(npx vercel@39.1.3 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "Production deployment completed: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
